name: foundly-complete
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lostfound
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: lostfound_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lostfound_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostfound -d lostfound"]
      interval: 3s
      retries: 20
  api:
    build: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Main: "Host=postgres;Port=5432;Database=lostfound;Username=lostfound;Password=lostfound_dev_only"
      AllowedEmailDomain: ""
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - lostfound_uploads:/app/wwwroot/uploads
  admin:
    build: ./admin
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      - api
  web:
    build: ./web
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
volumes:
  lostfound_db:
  lostfound_uploads:
