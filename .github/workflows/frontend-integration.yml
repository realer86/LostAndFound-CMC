name: Foundly frontend full regression
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/frontend-integration.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/frontend-integration.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build integrated frontend
        working-directory: frontend
        run: npm run build
      - name: Run source contracts and HTTP transport tests
        run: |
          node tests/integrated_frontend_syntax.mjs
          python tests/integrated_frontend_contract.py
          python tests/issue13_schema_contract.py
          python tests/issue14_ui_contract.py
          python tests/issue15_frontend_contract.py
          node --test tests/issue15_chat_api.test.cjs
      - name: Install Chromium for browser regression
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run historical Sprint 1 browser smoke test
        run: python tests/issue02_ui_smoke.py
      - name: Start Vite for E2E with simulated API
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/foundly-vite.log 2>&1 &
          for x in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5175/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/foundly-vite.log
          exit 1
      - name: Full React UI regression (all existing features, mock API)
        env:
          FOUNDLY_FRONTEND_URL: http://127.0.0.1:5175
        run: python tests/frontend_full_e2e.py
