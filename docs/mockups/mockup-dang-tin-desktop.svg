<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" width="1440" height="1100"><title>Foundly - UI mockup</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#f8fbfc"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#ffffff"/><rect x="40" y="19" width="42" height="42" rx="12" fill="#079e90"/><text x="95" y="49" fill="#163c47" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">found</text><text x="173" y="49" fill="#079e90" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">ly</text><text x="330" y="49" fill="#4e7280" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Trang chủ</text><text x="460" y="49" fill="#4e7280" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Tìm đồ thất lạc</text><text x="660" y="49" fill="#4e7280" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Đăng tin</text><rect x="1230" y="19" width="175" height="43" rx="11" fill="#079e90"/><text x="1318" y="46" fill="#ffffff" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">+ Đăng tin ngay</text><text x="90" y="123" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Trang chủ   /   Đăng tin mới</text><rect x="90" y="152" width="1260" height="151" rx="16" fill="#e5f8f1"/><text x="125" y="187" fill="#079e90" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="start">ĐƠN GIẢN &amp; NHANH CHÓNG</text><text x="125" y="246" fill="#163c47" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="800" text-anchor="start">Đăng tin đồ thất lạc</text><text x="125" y="275" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Điền những thông t