th="418" height="47" rx="9" fill="#ffffff" stroke="#e2ecef" stroke-width="1"/><text x="550" y="619" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">Chọn danh mục</text><text x="125" y="661" fill="#163c47" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start">Khu vực *</text><rect x="125" y="672" width="396" height="47" rx="9" fill="#ffffff" stroke="#e2ecef" stroke-width="1"/><text x="138" y="701" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">Chọn khu vực</text><text x="537" y="661" fill="#163c47" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start">Ngày giờ xảy ra *</text><rect x="537" y="672" width="418" height="47" rx="9" fill="#ffffff" stroke="#e2ecef" stroke-width="1"/><text x="550" y="701" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">Chọn ngày giờ</text><text x="125" y="744" fill="#163c47" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start">Địa điểm cụ thể</text><rect x="125" y="755" width="830" height="47" rx="9" fill="#ffffff" stroke="#e2ecef" stroke-width="1"/><text x="138" y="784" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">Bàn gần cửa sổ tầng 2...</text><text x="125" y="839" fill="#163c47" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start">Mô tả đồ vật *</text><rect x="125" y="853" width="830" height="99" rx="9" fill="#ffffff" stroke="#e2ecef" stroke-width="1"/><text x="138" y="881" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">Màu sắc, nhãn hiệu, dấu hiệu dễ nhận biết...</text><rect x="749" y="987" width="206" height="51" rx="10" fill="#079e90"/><text x="852" y="1019" fill="#ffffff" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Xem trước tin đăng</text><rect x="1025" y="326" width="325" height="337" rx="17" fill="#ffffff" stroke="#e2ecef" stroke-width="1"/><circle cx="1073" cy="378" r="24" fill="#e5f8ee"/><text x="1054" y="433" fill="#163c47" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="800" text-anchor="start">Đăng tin an toàn</text><text x="1054" y="467" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Chỉ mô tả đặc điểm cần thiết.</text><text x="1054" y="494" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Giữ kín thông tin riêng tư.</text><text x="1054" y="542" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">• Mô tả chính xác</text><text x="1054" y="573" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">• Gặp mặt nơi công cộng</text><text x="1054" y="604" fill="#7a939e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">• Không lộ giấy tờ nhạy cảm</text><rect x="1025" y="680" width="325" height="110" rx="13" fill="#fff9ec"/><text x="1045" y="717" fill="#98783e" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="start">Mẹo nhỏ</text><text x="1045" y="745" fill="#aa936f" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">Ảnh rõ và mô tả chi tiết giúp</text><text x="1045" y="767" fill="#aa936f" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">người khác nhận biết đồ vật.</text></svg>